
services:
  backend-chinaloh:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "4000"
    depends_on:
      db-chinaloh:
        condition: service_healthy
      redis-chinaloh:
        condition: service_healthy
    networks:
      - chinaloh-net
    security_opt:
      - no-new-privileges:true
    mem_limit: 320m

  db-chinaloh:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chinaloh-net
    mem_limit: 512m

  redis-chinaloh:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chinaloh-net
    mem_limit: 320m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend-chinaloh
    networks:
      - chinaloh-net
    mem_limit: 96m

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  chinaloh-net:
    driver: bridge
